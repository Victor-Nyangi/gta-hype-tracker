[project]
name = "gta-collector"
version = "0.1.0"
description = "Samples Twitch, Steam, YouTube and Wikipedia for the GTA VI hype tracker"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.scripts]
collector = "collector.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
